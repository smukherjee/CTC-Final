openapi: "3.0.3"
info:
  title: CTC-ERP Reporting API
  version: "1.0"
  description: |
    Active FR10 reporting contracts. All report endpoints are FY-aware unless noted.

paths:
  /api/reports/pending-billing:
    get:
      summary: Pending billing report
      parameters:
        - name: fy
          in: query
          schema: { type: string, example: "2025-26" }
      responses:
        "200":
          description: Pending billing rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRows"

  /api/reports/outstanding-receivables:
    get:
      summary: Outstanding receivables report
      parameters:
        - name: fy
          in: query
          schema: { type: string, example: "2025-26" }
      responses:
        "200":
          description: Outstanding rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRows"

  /api/reports/hirememo-register:
