  /api/reports/audit-log:
    get:
      summary: Audit log report
      parameters:
        - name: entity
          in: query
          schema: { type: string, example: "Invoice" }
        - name: user
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Audit log rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRows"

  /api/reports/debit-voucher-register:
