#     healthcheck:
#       test: ["CMD-SHELL", "pg_isready -U postgres -d ctc_erp"]
#       interval: 5s
#       timeout: 5s
#       retries: 10
#       start_period: 10s

  backend:
    build: ./backend
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    # depends_on:
    #   db:
    #     condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev
    # frontend container is self-contained; do not bind-mount source to /app
    ports:
      - "5173:5173"
    environment:
      - HOST=0.0.0.0
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
